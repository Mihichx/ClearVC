name: Update Version and Build Zip Asset

on:
  release:
    types: [published]

jobs:
  update-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4
      with:
        ref: main

    - name: Update version string in Controller.php
      uses: jacobtomlinson/gha-find-replace@v3
      with:
        find: "const VERSION = '[^']*';"
        replace: "const VERSION = '${{ github.event.release.tag_name }}';"
        include: "core/Controller.php"

    - name: Commit and Push automatically updated version
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "chore: auto-update framework version to ${{ github.event.release.tag_name }} [skip ci]"
        file_pattern: 'core/Controller.php'
        branch: main

    - name: Create ClearVC Framework Archive
      run: |
        zip -r clearvc-framework.zip . -x "*.git*" ".github*"

    - name: Upload Clean Zip to Release Assets
      uses: softprops/action-gh-release@v2
      with:
        files: clearvc-framework.zip
        tag_name: ${{ github.event.release.tag_name }}

name: Update Version inside PHP Code

on:
  release:
    types: [published]

jobs:
  update-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    # ИСПРАВЛЕНО: Явно заставляем робота переключиться на ветку main
    - name: Checkout repository code
      uses: actions/checkout@v4
      with:
        ref: main

    - name: Inject new version tag into Controller.php
      run: |
        VERSION_NUM=$(echo "${{ github.event.release.tag_name }}" | sed 's/^v//')
        sed -i -E "s/(const VERSION\s*=\s*['\"])[^'\"]*['\"]/\1$VERSION_NUM'/g" core/Controller.php

    - name: Commit and Push automatically updated version
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "chore: auto-update framework version to ${{ github.event.release.tag_name }} [skip ci]"
        file_pattern: 'core/Controller.php'
        branch: main
